# Fictional receiver and emission balance for AIR DEFENSE.
# Generations are game tiers, not real-world equipment specifications.
# RF reception is independent of player radar detection/track/lock UI states.
# Relative transmitter strength is normalized at 1 km; sensitivity is received power.
emitter.search.band=I
emitter.search.waveform=SEARCH
emitter.search.pattern=ROTATING
emitter.search.strength=1
emitter.search.horizontalDegrees=8
emitter.search.verticalDegrees=80
emitter.search.sideLobeGain=0
emitter.fireControl.band=I
emitter.fireControl.waveform=FIRE_CONTROL
emitter.fireControl.pattern=STEERED
emitter.fireControl.strength=1
emitter.fireControl.horizontalDegrees=6
emitter.fireControl.verticalDegrees=60
emitter.illumination.band=I
emitter.illumination.waveform=ILLUMINATION
emitter.illumination.pattern=STEERED
emitter.illumination.strength=1
emitter.illumination.horizontalDegrees=6
emitter.illumination.verticalDegrees=60
emitter.activeSeeker.band=I
emitter.activeSeeker.waveform=ACTIVE_SEEKER
emitter.activeSeeker.pattern=STEERED
emitter.activeSeeker.strength=.025
emitter.activeSeeker.horizontalDegrees=60
emitter.activeSeeker.verticalDegrees=60

# Independent visual sensing: pre-dawn and weather reduce range and increase dwell.
visual.nightVisibility=.45
visual.weatherVisibility=.9

# Aircraft receiver assignments are declared in aircraft.properties.

profile.GEN-0.enabled=false
profile.GEN-0.maws=false
profile.GEN-0.visual=true

profile.GEN-1.bands=H,I,J
profile.GEN-1.waveforms=SEARCH,PULSE_DOPPLER,FIRE_CONTROL,ILLUMINATION,ACTIVE_SEEKER
profile.GEN-1.library=SEARCH,FIRE_CONTROL
profile.GEN-1.sensitivity=.0002
profile.GEN-1.horizontalDegrees=360
profile.GEN-1.verticalDegrees=120
profile.GEN-1.rearBlindDegrees=0
profile.GEN-1.sectorDegrees=90
profile.GEN-1.delaySeconds=1.2
profile.GEN-1.memorySeconds=6
profile.GEN-1.capacity=4
profile.GEN-1.missChance=.05
profile.GEN-1.ambiguityChance=.08
profile.GEN-1.sampleSeconds=.25
profile.GEN-1.illuminationRecognition=false
profile.GEN-1.activeSeekerRecognition=false
profile.GEN-1.maws=false

profile.GEN-2.bands=G,H,I
profile.GEN-2.waveforms=SEARCH,PULSE_DOPPLER,FIRE_CONTROL,ILLUMINATION,ACTIVE_SEEKER
profile.GEN-2.library=SEARCH,FIRE_CONTROL,ILLUMINATION,ACTIVE_SEEKER
profile.GEN-2.sensitivity=.0002
profile.GEN-2.horizontalDegrees=360
profile.GEN-2.verticalDegrees=120
profile.GEN-2.rearBlindDegrees=0
profile.GEN-2.sectorDegrees=0
profile.GEN-2.bearingErrorDegrees=15
profile.GEN-2.delaySeconds=.7
profile.GEN-2.memorySeconds=8
profile.GEN-2.capacity=8
profile.GEN-2.missChance=.03
profile.GEN-2.ambiguityChance=.04
profile.GEN-2.sampleSeconds=.25
profile.GEN-2.maws=false
profile.GEN-2.visual=true
