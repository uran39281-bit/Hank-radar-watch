# Scan speed is 1..6; configurable mapping interpolates 10s at 1.00 to 5s at 6.00.
# Tracking capacity and shared per-missile external guidance capacity are independent.
# radar.channels is the shared DATALINKS pool. Infrared means battery IRST capability.
